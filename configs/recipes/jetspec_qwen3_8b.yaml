# Formal single-node JetSpec recipe: causal parallel Draft training, exact
# recovery and native export. Hyperparameters are a starting point, not a
# convergence or acceptance claim.
model:
  target_model_path: ${oc.env:ASPEC_TARGET_MODEL,Qwen/Qwen3-8B}
  native_context_length: 32768
  trust_remote_code: false
  draft_model_config: aspec/config/jetspec_qwen3_8b_draft_config.json
dataset:
  eval_interval: 100
  eval_micro_batch_size: 1
  train_data_path: ${oc.env:ASPEC_TRAIN_DATA}
  eval_data_path: ${oc.env:ASPEC_EVAL_DATA}
  chat_template: qwen3-instruct
  prompt_key: conversations
  min_loss_tokens: 32
  shuffle_dataset: true
  dataset_seed: 42
training:
  attention_backend: flex_attention
  draft_context_parallel_size: 1
  micro_batch_size: 1
  draft_accumulation_steps: 2
  learning_rate: 6e-4
  min_lr: 6e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_length: 4096
  num_epochs: 3
  warmup_ratio: 0.04
  seed: 42
  continual_training: false
  deterministic_anchor_sampling: false
  training_num_gpus_per_node: 2
  training_num_nodes: 1
  placement_strategy: inference_first
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  compile_model: false
  max_concurrent_batches: 1
  streaming_dispatch_with_training: true
  pipeline_dispatch_with_training: true
  prefetch_depth: 1
  save_interval: 100
  save_per_epoch: false
  save_final_checkpoint: true
  max_checkpoints: 2
  dflash_block_size: 16
  dflash_packing: false
  dflash_num_target_layers: 5
  dflash_num_anchors: 128
  dflash_loss_objective: decay
  dflash_loss_decay_gamma: 0.0
  dflash_ce_loss_alpha: 0.0
  dflash_l1_loss_alpha: 0.0
  jetspec_distillation_temperature: 1.0
  jetspec_kl_chunk_rows: 256
  jetspec_loss_decay_gamma: 0.0
inference:
  inference_engine_type: sgl
  store_last_hidden_states: true
  target_prefill_memory_optimized: false
  inference_num_gpus: 1
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 3
  inference_fetch_batch: 8
  inference_buffer_threshold: 2
  max_sample_pool_size: 12
  inference_batch_size: 2
  sglang:
    tp_size: 1
    mem_fraction_static: 0.5
mooncake:
  master_server_address: null
  metadata_server: null
  data_plane: store
  protocol: tcp
  enable_gpu_direct: false
  allow_host_fallback: false
  global_segment_size: 32GB
  local_buffer_size: 8GB
  host_buffer_size: 1GB
  async_put_pool_size: 1
  enable_hard_pin: true
  max_seq_len: 4096
  hidden_dim: 4096
logging:
  report_to: none
debug:
  enable_perf_metrics: true
output_dir: outputs/jetspec-qwen3-8b
cache_dir: cache/jetspec-qwen3-8b
