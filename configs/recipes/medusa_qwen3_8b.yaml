# Release training starting point: three passes, held-out eval and checkpoints.
# Hyperparameters are not a convergence/quality claim; see docs/user-guide/recipes.md.
# Formal single-node heads-only Medusa training, resume and native export recipe.
model:
  target_model_path: ${oc.env:ASPEC_TARGET_MODEL,Qwen/Qwen3-8B}
  native_context_length: 32768
  trust_remote_code: false
  draft_model_config: aspec/config/medusa_qwen3_8b_draft_config.json
dataset:
  eval_interval: 100
  eval_micro_batch_size: 1
  train_data_path: ${oc.env:ASPEC_TRAIN_DATA}
  eval_data_path: ${oc.env:ASPEC_EVAL_DATA}
  chat_template: qwen3-instruct
  prompt_key: conversations
  min_loss_tokens: 1
  shuffle_dataset: true
  dataset_seed: 42
training:
  attention_backend: sdpa
  draft_context_parallel_size: 1
  micro_batch_size: 1
  draft_accumulation_steps: 4
  learning_rate: 6e-4
  min_lr: 6e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_length: 4096
  num_epochs: 3
  warmup_ratio: 0.04
  seed: 42
  continual_training: false
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  placement_strategy: inference_first
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  compile_model: false
  max_concurrent_batches: 1
  streaming_dispatch_with_training: true
  pipeline_dispatch_with_training: true
  prefetch_depth: 1
  save_interval: 100
  save_per_epoch: false
  save_final_checkpoint: true
  max_checkpoints: 2
  gradient_checkpointing: true
  dflash_packing: false
inference:
  inference_engine_type: sgl
  store_last_hidden_states: false
  target_prefill_memory_optimized: false
  inference_num_gpus: 1
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 2
  inference_fetch_batch: 8
  inference_buffer_threshold: 2
  max_sample_pool_size: 12
  inference_batch_size: 2
  sglang:
    tp_size: 1
    mem_fraction_static: 0.5
mooncake:
  data_plane: store
  protocol: tcp
  require_nvlink: false
  allow_host_fallback: false
  max_seq_len: 4096
  hidden_dim: 4096
  global_segment_size: 32GB
  local_buffer_size: 8GB
  host_buffer_size: 1GB
  async_put_pool_size: 1
  enable_hard_pin: true
logging:
  report_to: none
output_dir: outputs/qwen3-8b-medusa
cache_dir: cache/qwen3-8b-medusa