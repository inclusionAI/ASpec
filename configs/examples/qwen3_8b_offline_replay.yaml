# Single-GPU DSpark replay; see examples/qwen3-8b-offline/README.md.
# Keep the Target checkpoint and capture settings identical to materialization.
model:
  target_model_path: ${oc.env:ASPEC_TARGET_MODEL}
  native_context_length: 32768
  trust_remote_code: false
  draft_model_config: aspec/config/dspark_draft_config.json
dataset:
  train_data_path: null
  eval_data_path: null
  renderer: null
  min_loss_tokens: 14
  eval_interval: 4
  eval_micro_batch_size: 1
  shuffle_dataset: false
training:
  attention_backend: cudnn_flex_attention
  draft_context_parallel_size: 1
  dflash_packing: false
  micro_batch_size: 1
  draft_accumulation_steps: 1
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  fsdp_strategy: REPLICATE
  max_seq_length: 4096
  num_epochs: 100
  num_train_steps: 8
  lr_total_steps: 8
  learning_rate: 0.0006
  min_lr: 0.00006
  warmup_ratio: 0.0
  seed: 42
  dspark_num_target_layers: 5
  dspark_num_anchors: 64
  dflash_block_size: 7
  prefetch_depth: 1
  streaming_dispatch_with_training: true
  pipeline_dispatch_with_training: true
  save_interval: 4
  save_final_checkpoint: true
  save_per_epoch: false
inference:
  inference_engine_type: offline
  inference_num_gpus: 0
  target_prefill_memory_optimized: false
  store_last_hidden_states: true
  inference_batch_size: 1
  inference_fetch_batch: 2
  inference_buffer_threshold: 2
  max_sample_pool_size: 4
  offline:
    data_path: ${oc.env:ASPEC_OFFLINE_DATA}
    num_engines: 1
mooncake:
  data_plane: store
  protocol: tcp
  enable_gpu_direct: false
  require_nvlink: false
  hidden_dim: 4096
  max_seq_len: 4096
  global_segment_size: 8GB
  local_buffer_size: 2GB
  host_buffer_size: 2GB
logging:
  report_to: none
output_dir: outputs/qwen3-8b-offline
cache_dir: cache/qwen3-8b-offline
