<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
<title id="title">End-to-end steady-window training throughput</title>
<desc id="desc">Six panels compare TorchSpec, SpecForge, AngelSpec and ASpec on Qwen3-8B, Qwen3.5-9B and Qwen3.8-27B at short and long context. All panels share a zero-based 0–130k input tokens/s scale. AngelSpec 27B/256K has no complete result.</desc>
<metadata>{&quot;source&quot;:&quot;docs/benchmarks/results.md&quot;,&quot;metric&quot;:&quot;committed training input tokens per second&quot;,&quot;window&quot;:&quot;steady window from completion of warmup update eight through final optimizer completion&quot;,&quot;maximum&quot;:130000,&quot;workloads&quot;:[{&quot;name&quot;:&quot;Qwen3-8B / 4K&quot;,&quot;TorchSpec&quot;:34080.95,&quot;SpecForge&quot;:31063.56,&quot;AngelSpec&quot;:28952.97,&quot;ASpec&quot;:77721.37},{&quot;name&quot;:&quot;Qwen3-8B / 128K&quot;,&quot;TorchSpec&quot;:66103.68,&quot;SpecForge&quot;:104216.51,&quot;AngelSpec&quot;:73561.63,&quot;ASpec&quot;:121237.15},{&quot;name&quot;:&quot;Qwen3.5-9B / 4K&quot;,&quot;TorchSpec&quot;:27858.39,&quot;SpecForge&quot;:25024.26,&quot;AngelSpec&quot;:22478.02,&quot;ASpec&quot;:66786.94},{&quot;name&quot;:&quot;Qwen3.5-9B / 256K&quot;,&quot;TorchSpec&quot;:55040.72,&quot;SpecForge&quot;:105469.48,&quot;AngelSpec&quot;:87413.03,&quot;ASpec&quot;:113141.77},{&quot;name&quot;:&quot;Qwen3.8-27B / 4K&quot;,&quot;TorchSpec&quot;:22223.87,&quot;SpecForge&quot;:20681.76,&quot;AngelSpec&quot;:18593.31,&quot;ASpec&quot;:33926.93},{&quot;name&quot;:&quot;Qwen3.8-27B / 256K&quot;,&quot;TorchSpec&quot;:22940.76,&quot;SpecForge&quot;:32743.82,&quot;AngelSpec&quot;:null,&quot;ASpec&quot;:35805.46}]}</metadata>
