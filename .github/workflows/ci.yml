name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "ossrc/**", "**/oss-rc"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: |
          python -m venv "$RUNNER_TEMP/aspec-quality-venv"
          source "$RUNNER_TEMP/aspec-quality-venv/bin/activate"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip ruff
      - name: Lint
        run: python -m ruff check aspec tests tools setup.py
      - name: Compile Python sources
        run: python -m compileall -q aspec tests tools
      - name: Check maintained documentation links
        run: python -m tools.check_docs

  cpu-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU test runtime
        run: |
          python -m venv "$RUNNER_TEMP/aspec-ci-venv"
          source "$RUNNER_TEMP/aspec-ci-venv/bin/activate"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.13.0+cpu
          python -m pip install -r requirements/ci-cpu.txt
          python -m pip install --no-deps -e .
      - name: Run dependency-light source contracts
        run: python -m pytest -q tests/source
      - name: Run offline CPU contracts
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q tests/cpu
